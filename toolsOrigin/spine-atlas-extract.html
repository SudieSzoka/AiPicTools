<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 图集拆分</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --sp-brand: #0f766e;
            --sp-brand-hover: #115e59;
            --sp-text: #172033;
            --sp-text-weak: #526079;
            --sp-stroke-weak: #d8dee9;
            --sp-fill: #f4f7fa;
            --sp-bg: #eef2f6;
            --sp-white: #ffffff;
            --sp-danger: #b42318;
            --sp-danger-fill: #fff2f0;
            --sp-radius-sm: 8px;
            --sp-radius-md: 16px;
            --sp-shadow: 0 12px 32px rgba(26, 39, 64, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--sp-bg);
            color: var(--sp-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        button, input, select { font: inherit; }

        .sp-page {
            width: min(1280px, calc(100% - 32px));
            margin: 32px auto 48px;
        }

        .sp-hero h1 {
            margin: 0;
            font-size: clamp(26px, 4vw, 38px);
            line-height: 1.2;
        }

        .sp-eyebrow {
            margin: 0 0 8px;
            color: var(--sp-brand);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .sp-intro {
            max-width: 760px;
            margin: 12px 0 24px;
            color: var(--sp-text-weak);
            font-size: 15px;
            line-height: 1.7;
        }

        .sp-card {
            background: var(--sp-white);
            border: 1px solid var(--sp-stroke-weak);
            border-radius: var(--sp-radius-md);
            box-shadow: var(--sp-shadow);
            padding: 24px;
            margin-bottom: 24px;
        }

        .sp-card h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .sp-drop {
            border: 2px dashed #b6c2d2;
            border-radius: var(--sp-radius-md);
            background: var(--sp-fill);
            padding: 32px 24px;
            text-align: center;
            transition: border-color .2s, background .2s;
        }

        .sp-drop.is-active {
            border-color: var(--sp-brand);
            background: #e8f5f2;
        }

        .sp-drop-title {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 600;
        }

        .sp-drop-hint {
            margin: 0 0 18px;
            color: var(--sp-text-weak);
            font-size: 13px;
            line-height: 1.6;
        }

        .sp-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .sp-btn {
            border: 1px solid var(--sp-brand);
            background: var(--sp-brand);
            color: #fff;
            border-radius: var(--sp-radius-sm);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, opacity .2s;
        }

        .sp-btn:hover:not(:disabled) { background: var(--sp-brand-hover); }

        .sp-btn.is-ghost {
            background: var(--sp-white);
            color: var(--sp-brand);
        }

        .sp-btn.is-ghost:hover:not(:disabled) { background: #e8f5f2; }

        .sp-btn:disabled { opacity: .5; cursor: not-allowed; }

        .sp-settings {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 32px;
            align-items: flex-start;
        }

        .sp-field { max-width: 360px; }

        .sp-check {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            cursor: pointer;
        }

        .sp-check input { margin: 3px 0 0; }

        .sp-check-text { font-size: 14px; font-weight: 600; }

        .sp-check-note {
            display: block;
            margin-top: 4px;
            color: var(--sp-text-weak);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.5;
        }

        .sp-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .sp-field input[type="text"] {
            width: 260px;
            padding: 9px 12px;
            border: 1px solid var(--sp-stroke-weak);
            border-radius: var(--sp-radius-sm);
            background: var(--sp-white);
            color: var(--sp-text);
        }

        .sp-field input[type="text"]:focus {
            outline: 2px solid rgba(15, 118, 110, .35);
            border-color: var(--sp-brand);
        }

        .sp-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 0;
        }

        .sp-stat {
            flex: 1 1 140px;
            background: var(--sp-fill);
            border-radius: var(--sp-radius-sm);
            padding: 12px 16px;
        }

        .sp-stat-label {
            color: var(--sp-text-weak);
            font-size: 12px;
        }

        .sp-stat-value {
            margin-top: 4px;
            font-size: 20px;
            font-weight: 700;
            color: var(--sp-brand);
        }

        .sp-msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--sp-radius-sm);
            background: var(--sp-fill);
            color: var(--sp-text-weak);
            font-size: 13px;
            line-height: 1.7;
        }

        .sp-msg.is-error {
            background: var(--sp-danger-fill);
            color: var(--sp-danger);
        }

        .sp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .sp-item {
            border: 1px solid var(--sp-stroke-weak);
            border-radius: var(--sp-radius-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .sp-thumb {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background-color: #fbfcfe;
            background-image:
                linear-gradient(45deg, #e7ecf2 25%, transparent 25%, transparent 75%, #e7ecf2 75%),
                linear-gradient(45deg, #e7ecf2 25%, transparent 25%, transparent 75%, #e7ecf2 75%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        .sp-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sp-meta {
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--sp-text-weak);
            border-top: 1px solid var(--sp-stroke-weak);
        }

        .sp-name {
            display: block;
            color: var(--sp-text);
            font-size: 13px;
            font-weight: 600;
            word-break: break-all;
        }

        .sp-tag {
            display: inline-block;
            margin-left: 6px;
            padding: 0 6px;
            border-radius: 999px;
            background: #e8f5f2;
            color: var(--sp-brand);
            font-size: 11px;
            font-weight: 700;
            vertical-align: middle;
        }

        .sp-save {
            display: block;
            padding: 8px;
            text-align: center;
            background: var(--sp-fill);
            color: var(--sp-brand);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            border-top: 1px solid var(--sp-stroke-weak);
        }

        .sp-save:hover { background: #e8f5f2; }

        .sp-empty {
            padding: 40px;
            text-align: center;
            color: var(--sp-text-weak);
            font-size: 14px;
        }

        #sp-folder-input, #sp-file-input { display: none; }
    </style>
</head>
<body>
    <div class="sp-page">
        <div class="sp-hero">
            <p class="sp-eyebrow">SPINE TOOLS</p>
            <h1>Spine 图集拆分</h1>
            <p class="sp-intro">
                导入 Spine 导出的 .atlas 与 .png（可直接拖入整个文件夹），自动按 atlas 描述拆分出每一个小图标，
                支持旋转还原、原始尺寸还原与预乘 Alpha 还原，可单张保存或打包下载 ZIP。所有处理均在浏览器本地完成。
            </p>
        </div>

        <div class="sp-card">
            <h2>1. 导入图集</h2>
            <div class="sp-drop" id="sp-drop">
                <p class="sp-drop-title">把 spine 文件夹拖到这里</p>
                <p class="sp-drop-hint">
                    支持 .atlas / .atlas.txt 与同名 png，一次可导入多套图集（含多页图集）
                </p>
                <div class="sp-actions">
                    <button type="button" class="sp-btn" id="sp-pick-folder">选择文件夹</button>
                    <button type="button" class="sp-btn is-ghost" id="sp-pick-file">选择文件</button>
                </div>
                <input type="file" id="sp-folder-input" webkitdirectory directory multiple>
                <input type="file" id="sp-file-input" accept=".atlas,.txt,image/*" multiple>
            </div>
            <div class="sp-msg" id="sp-msg">等待导入图集文件。</div>
        </div>

        <div class="sp-card">
            <h2>2. 导出设置</h2>
            <div class="sp-settings">
                <label class="sp-check">
                    <input type="checkbox" id="sp-opt-orig">
                    <span class="sp-check-text">
                        还原原始尺寸
                        <span class="sp-check-note">按 atlas 的 offsets/orig 补回打包时裁掉的透明边，保持各部件对齐关系。</span>
                    </span>
                </label>
                <label class="sp-check">
                    <input type="checkbox" id="sp-opt-pma">
                    <span class="sp-check-text">
                        还原预乘 Alpha
                        <span class="sp-check-note">图集标记 pma:true 时自动勾选，将颜色除以 Alpha 还原为普通 PNG。</span>
                    </span>
                </label>
                <div class="sp-field">
                    <label for="sp-filter">按名称筛选</label>
                    <input type="text" id="sp-filter" placeholder="输入关键字，留空显示全部">
                </div>
            </div>

            <div class="sp-stats">
                <div class="sp-stat">
                    <div class="sp-stat-label">图集数量</div>
                    <div class="sp-stat-value" id="sp-stat-atlas">0</div>
                </div>
                <div class="sp-stat">
                    <div class="sp-stat-label">小图总数</div>
                    <div class="sp-stat-value" id="sp-stat-total">0</div>
                </div>
                <div class="sp-stat">
                    <div class="sp-stat-label">当前显示</div>
                    <div class="sp-stat-value" id="sp-stat-shown">0</div>
                </div>
            </div>

            <div class="sp-actions" style="justify-content:flex-start;margin-top:20px;">
                <button type="button" class="sp-btn" id="sp-download" disabled>打包下载 ZIP</button>
                <button type="button" class="sp-btn is-ghost" id="sp-reset">重置</button>
            </div>
        </div>

        <div class="sp-card">
            <h2>3. 小图预览</h2>
            <div class="sp-grid" id="sp-grid"></div>
            <div class="sp-empty" id="sp-empty">导入 .atlas 与 png 后，这里会列出拆分结果。</div>
        </div>
    </div>

    <script>
        const dropArea = document.getElementById('sp-drop');
        const folderInput = document.getElementById('sp-folder-input');
        const fileInput = document.getElementById('sp-file-input');
        const pickFolderBtn = document.getElementById('sp-pick-folder');
        const pickFileBtn = document.getElementById('sp-pick-file');
        const optOrig = document.getElementById('sp-opt-orig');
        const optPma = document.getElementById('sp-opt-pma');
        const filterInput = document.getElementById('sp-filter');
        const downloadBtn = document.getElementById('sp-download');
        const resetBtn = document.getElementById('sp-reset');
        const gridEl = document.getElementById('sp-grid');
        const emptyEl = document.getElementById('sp-empty');
        const msgEl = document.getElementById('sp-msg');
        const statAtlasEl = document.getElementById('sp-stat-atlas');
        const statTotalEl = document.getElementById('sp-stat-total');
        const statShownEl = document.getElementById('sp-stat-shown');

        // 已导入的图集：{ name, pages: [{ file, size, pma, scale, regions, image }] }
        let atlases = [];
        // 拆分结果：{ atlasName, path, fileName, width, height, rotated, blob, url }
        let sprites = [];
        let objectUrls = [];

        pickFolderBtn.addEventListener('click', () => folderInput.click());
        pickFileBtn.addEventListener('click', () => fileInput.click());
        folderInput.addEventListener('change', () => loadFiles(Array.from(folderInput.files)));
        fileInput.addEventListener('change', () => loadFiles(Array.from(fileInput.files)));
        optOrig.addEventListener('change', rebuildSprites);
        optPma.addEventListener('change', rebuildSprites);
        filterInput.addEventListener('input', renderSprites);
        downloadBtn.addEventListener('click', downloadZip);
        resetBtn.addEventListener('click', resetAll);

        ['dragenter', 'dragover'].forEach(type => {
            dropArea.addEventListener(type, e => {
                e.preventDefault();
                dropArea.classList.add('is-active');
            });
        });
        ['dragleave', 'drop'].forEach(type => {
            dropArea.addEventListener(type, e => {
                e.preventDefault();
                if (type === 'dragleave' && dropArea.contains(e.relatedTarget)) return;
                dropArea.classList.remove('is-active');
            });
        });
        dropArea.addEventListener('drop', async e => {
            const files = await collectDroppedFiles(e.dataTransfer);
            loadFiles(files);
        });

        // 递归读取拖入的文件夹
        async function collectDroppedFiles(dataTransfer) {
            const entries = Array.from(dataTransfer.items || [])
                .map(item => item.webkitGetAsEntry && item.webkitGetAsEntry())
                .filter(Boolean);

            if (!entries.length) return Array.from(dataTransfer.files || []);

            const files = [];
            async function walk(entry) {
                if (entry.isFile) {
                    files.push(await new Promise((resolve, reject) => entry.file(resolve, reject)));
                    return;
                }
                const reader = entry.createReader();
                let batch;
                do {
                    batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
                    for (const child of batch) await walk(child);
                } while (batch.length);
            }
            for (const entry of entries) await walk(entry);
            return files;
        }

        function baseName(name) {
            return name.replace(/^.*[\\/]/, '');
        }

        function isAtlasFile(file) {
            const name = baseName(file.name).toLowerCase();
            return name.endsWith('.atlas') || name.endsWith('.atlas.txt');
        }

        function isImageFile(file) {
            return /\.(png|jpe?g|webp)$/i.test(baseName(file.name));
        }

        // 解析 atlas 文本，兼容 libgdx 旧格式(xy/size/orig/offset)与 Spine 4.x 新格式(bounds/offsets)
        function parseAtlas(text) {
            const lines = text.split(/\r\n|\r|\n/);
            const pages = [];
            let page = null;
            let i = 0;

            const readEntry = line => {
                if (line === undefined) return null;
                const trimmed = line.trim();
                if (!trimmed) return null;
                const colon = trimmed.indexOf(':');
                if (colon === -1) return null;
                return {
                    key: trimmed.slice(0, colon).trim(),
                    values: trimmed.slice(colon + 1).split(',').map(part => part.trim())
                };
            };

            while (i < lines.length) {
                const line = lines[i++].trim();
                if (!line) {
                    page = null;
                    continue;
                }

                if (!page) {
                    page = { file: line, size: null, pma: false, scale: 1, regions: [], image: null };
                    pages.push(page);
                    let entry;
                    while ((entry = readEntry(lines[i]))) {
                        i++;
                        if (entry.key === 'size') {
                            page.size = { w: Number(entry.values[0]), h: Number(entry.values[1]) };
                        } else if (entry.key === 'pma') {
                            page.pma = entry.values[0] === 'true';
                        } else if (entry.key === 'scale') {
                            page.scale = Number(entry.values[0]) || 1;
                        }
                    }
                    continue;
                }

                const region = {
                    name: line, x: 0, y: 0, w: 0, h: 0,
                    ox: 0, oy: 0, ow: 0, oh: 0, degrees: 0, index: -1
                };
                let entry;
                while ((entry = readEntry(lines[i]))) {
                    i++;
                    const nums = entry.values.map(Number);
                    switch (entry.key) {
                        case 'bounds':
                            region.x = nums[0]; region.y = nums[1];
                            region.w = nums[2]; region.h = nums[3];
                            break;
                        case 'offsets':
                            region.ox = nums[0]; region.oy = nums[1];
                            region.ow = nums[2]; region.oh = nums[3];
                            break;
                        case 'xy':
                            region.x = nums[0]; region.y = nums[1];
                            break;
                        case 'size':
                            region.w = nums[0]; region.h = nums[1];
                            break;
                        case 'orig':
                            region.ow = nums[0]; region.oh = nums[1];
                            break;
                        case 'offset':
                            region.ox = nums[0]; region.oy = nums[1];
                            break;
                        case 'rotate':
                            if (entry.values[0] === 'true') region.degrees = 90;
                            else if (entry.values[0] === 'false') region.degrees = 0;
                            else region.degrees = Number(entry.values[0]) || 0;
                            break;
                        case 'index':
                            region.index = nums[0];
                            break;
                    }
                }
                if (region.w > 0 && region.h > 0) page.regions.push(region);
            }

            return pages;
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                objectUrls.push(url);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(`无法读取图片：${baseName(file.name)}`));
                img.src = url;
            });
        }

        async function loadFiles(files) {
            const atlasFiles = files.filter(isAtlasFile);
            const imageFiles = files.filter(isImageFile);

            if (!atlasFiles.length) {
                showMessage('未找到 .atlas 文件，请导入包含 atlas 与 png 的文件夹。', true);
                return;
            }

            showMessage('正在解析图集…');

            const imageMap = new Map();
            for (const file of imageFiles) {
                imageMap.set(baseName(file.name).toLowerCase(), file);
            }

            const loaded = [];
            const warnings = [];

            for (const file of atlasFiles) {
                const atlasName = baseName(file.name).replace(/\.atlas(\.txt)?$/i, '');
                let pages;
                try {
                    pages = parseAtlas(await file.text());
                } catch (error) {
                    warnings.push(`${baseName(file.name)} 解析失败：${error.message}`);
                    continue;
                }

                for (const page of pages) {
                    const pageFile = imageMap.get(page.file.toLowerCase())
                        || (pages.length === 1 && imageFiles.length === 1 ? imageFiles[0] : null);
                    if (!pageFile) {
                        warnings.push(`缺少贴图文件：${page.file}`);
                        continue;
                    }
                    try {
                        page.image = await loadImage(pageFile);
                    } catch (error) {
                        warnings.push(error.message);
                    }
                }

                const usablePages = pages.filter(page => page.image);
                if (usablePages.length) loaded.push({ name: atlasName, pages: usablePages });
            }

            if (!loaded.length) {
                showMessage(['没有可用的图集。', ...warnings].join('<br>'), true);
                return;
            }

            atlases = loaded;
            optPma.checked = loaded.some(atlas => atlas.pages.some(page => page.pma));

            const notes = [`已导入 ${loaded.length} 套图集。`];
            loaded.forEach(atlas => {
                atlas.pages.forEach(page => {
                    const declared = page.size;
                    const img = page.image;
                    if (declared && (declared.w !== img.naturalWidth || declared.h !== img.naturalHeight)) {
                        notes.push(`${page.file}：贴图实际尺寸 ${img.naturalWidth}×${img.naturalHeight}，`
                            + `与 atlas 记录的 ${declared.w}×${declared.h} 不一致，已按比例换算坐标。`);
                    }
                });
            });
            showMessage([...notes, ...warnings].join('<br>'), false);

            rebuildSprites();
        }

        function releaseSprites() {
            sprites.forEach(sprite => URL.revokeObjectURL(sprite.url));
            sprites = [];
        }

        async function rebuildSprites() {
            if (!atlases.length) return;

            releaseSprites();
            const multipleAtlases = atlases.length > 1;
            const result = [];

            for (const atlas of atlases) {
                const used = new Set();
                for (const page of atlas.pages) {
                    for (const region of page.regions) {
                        const canvas = drawRegion(page, region);
                        let name = region.name + (region.index >= 0 ? `_${region.index}` : '');
                        while (used.has(name.toLowerCase())) name += '_copy';
                        used.add(name.toLowerCase());

                        const safeName = name.replace(/[\\:*?"<>|]/g, '_');
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                        const url = URL.createObjectURL(blob);
                        result.push({
                            atlasName: atlas.name,
                            path: (multipleAtlases ? `${atlas.name}/` : '') + `${safeName}.png`,
                            fileName: `${safeName.replace(/\//g, '_')}.png`,
                            name,
                            width: canvas.width,
                            height: canvas.height,
                            rotated: region.degrees === 90,
                            blob,
                            url
                        });
                    }
                }
            }

            sprites = result;
            statAtlasEl.textContent = atlases.length;
            statTotalEl.textContent = sprites.length;
            downloadBtn.disabled = sprites.length === 0;
            renderSprites();
        }

        // 按 atlas 记录裁切单个小图；rotate:90 表示打包时逆时针旋转过，需顺时针转回
        function drawRegion(page, region) {
            const img = page.image;
            const scaleX = page.size ? img.naturalWidth / page.size.w : 1;
            const scaleY = page.size ? img.naturalHeight / page.size.h : 1;

            const rotated = region.degrees === 90;
            const packedW = rotated ? region.h : region.w;
            const packedH = rotated ? region.w : region.h;

            const restoreOriginal = optOrig.checked && region.ow > 0 && region.oh > 0;
            const canvas = document.createElement('canvas');
            canvas.width = restoreOriginal ? region.ow : region.w;
            canvas.height = restoreOriginal ? region.oh : region.h;

            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';
            ctx.save();
            if (restoreOriginal) ctx.translate(region.ox, region.oh - region.oy - region.h);
            if (rotated) {
                ctx.translate(region.w, 0);
                ctx.rotate(Math.PI / 2);
            }
            ctx.drawImage(
                img,
                region.x * scaleX, region.y * scaleY, packedW * scaleX, packedH * scaleY,
                0, 0, packedW, packedH
            );
            ctx.restore();

            if (optPma.checked) unpremultiply(ctx, canvas.width, canvas.height);
            return canvas;
        }

        function unpremultiply(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const alpha = data[i + 3];
                if (alpha === 0 || alpha === 255) continue;
                data[i] = Math.min(255, Math.round(data[i] * 255 / alpha));
                data[i + 1] = Math.min(255, Math.round(data[i + 1] * 255 / alpha));
                data[i + 2] = Math.min(255, Math.round(data[i + 2] * 255 / alpha));
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function getVisibleSprites() {
            const keyword = filterInput.value.trim().toLowerCase();
            if (!keyword) return sprites;
            return sprites.filter(sprite => sprite.name.toLowerCase().includes(keyword));
        }

        function renderSprites() {
            const visible = getVisibleSprites();
            statShownEl.textContent = visible.length;
            gridEl.innerHTML = '';

            if (!visible.length) {
                emptyEl.style.display = 'block';
                emptyEl.textContent = sprites.length
                    ? '没有匹配关键字的小图。'
                    : '导入 .atlas 与 png 后，这里会列出拆分结果。';
                return;
            }

            emptyEl.style.display = 'none';
            const fragment = document.createDocumentFragment();
            visible.forEach(sprite => {
                const item = document.createElement('div');
                item.className = 'sp-item';

                const thumb = document.createElement('div');
                thumb.className = 'sp-thumb';
                const preview = document.createElement('img');
                preview.src = sprite.url;
                preview.alt = sprite.name;
                thumb.appendChild(preview);

                const meta = document.createElement('div');
                meta.className = 'sp-meta';
                const nameEl = document.createElement('span');
                nameEl.className = 'sp-name';
                nameEl.textContent = sprite.name;
                meta.appendChild(nameEl);
                meta.appendChild(document.createTextNode(`${sprite.width}×${sprite.height}px`));
                if (sprite.rotated) {
                    const tag = document.createElement('span');
                    tag.className = 'sp-tag';
                    tag.textContent = '已转正';
                    meta.appendChild(tag);
                }

                const save = document.createElement('a');
                save.className = 'sp-save';
                save.href = sprite.url;
                save.download = sprite.fileName;
                save.textContent = '保存 PNG';

                item.append(thumb, meta, save);
                fragment.appendChild(item);
            });
            gridEl.appendChild(fragment);
        }

        async function downloadZip() {
            const visible = getVisibleSprites();
            if (!visible.length) return;

            if (typeof JSZip === 'undefined') {
                showMessage('JSZip 加载失败，请检查网络后重试，或使用单张“保存 PNG”。', true);
                return;
            }

            downloadBtn.disabled = true;
            const originalText = downloadBtn.textContent;
            downloadBtn.textContent = '正在打包…';

            try {
                const zip = new JSZip();
                visible.forEach(sprite => zip.file(sprite.path, sprite.blob));
                const blob = await zip.generateAsync({ type: 'blob' }, metadata => {
                    downloadBtn.textContent = `正在打包 ${Math.round(metadata.percent)}%`;
                });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${atlases.length === 1 ? atlases[0].name : 'spine-atlas'}-${visible.length}.zip`;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showMessage(`已打包下载 ${visible.length} 张小图。`);
            } catch (error) {
                showMessage(`打包失败：${error.message}`, true);
            } finally {
                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            }
        }

        function showMessage(html, isError = false) {
            msgEl.innerHTML = html;
            msgEl.classList.toggle('is-error', isError);
        }

        function resetAll() {
            releaseSprites();
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            objectUrls = [];
            atlases = [];
            folderInput.value = '';
            fileInput.value = '';
            filterInput.value = '';
            optOrig.checked = false;
            optPma.checked = false;
            downloadBtn.disabled = true;
            statAtlasEl.textContent = '0';
            statTotalEl.textContent = '0';
            statShownEl.textContent = '0';
            gridEl.innerHTML = '';
            emptyEl.style.display = 'block';
            emptyEl.textContent = '导入 .atlas 与 png 后，这里会列出拆分结果。';
            showMessage('等待导入图集文件。');
        }
    </script>
</body>
</html>
